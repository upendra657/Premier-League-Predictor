# Publish the interactive demo and the results dashboard to GitHub Pages.
#
# The site is assembled from reports/ rather than uploading the repository
# wholesale: shipping the whole tree would publish archive/v1 and several
# megabytes of superseded CSVs to a web host for no reason.
#
# The demo runs the model in the visitor's browser, so there is no server to
# wake up and nothing to keep warm.
name: Deploy demo and dashboard to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "reports/web/**"
      - "reports/dashboard.html"
      - "reports/scorecard.html"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          for f in reports/web/index.html reports/web/model.json \
                   reports/web/teams.json reports/dashboard.html \
                   reports/scorecard.html; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          mkdir -p _site
          cp reports/web/index.html  _site/index.html      # interactive demo
          cp reports/web/model.json  _site/model.json      # booster, ~172KB gzipped
          cp reports/web/teams.json  _site/teams.json
          cp reports/dashboard.html  _site/results.html    # full results
          cp reports/scorecard.html  _site/scorecard.html  # the track record
          echo "Assembled:"; du -h _site/* | sed 's/^/  /'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
