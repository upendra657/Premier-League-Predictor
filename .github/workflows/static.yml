# Publish the results dashboard to GitHub Pages.
#
# The site is assembled from reports/ rather than uploading the repository
# wholesale: the dashboard is a self-contained HTML document, and shipping the
# whole tree would publish archive/v1 and several megabytes of superseded CSVs
# to a web host for no reason.
name: Deploy results dashboard to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "reports/dashboard.html"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          test -f reports/dashboard.html || {
            echo "reports/dashboard.html missing; regenerate with python -m src.dashboard"
            exit 1
          }
          mkdir -p _site
          cp reports/dashboard.html _site/index.html
          # Nothing else is copied: the dashboard inlines its own CSS and SVG.
          echo "Assembled $(du -h _site/index.html | cut -f1) site"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
